# Render Blueprint: one-click backend + Postgres deploy.
# Frontend deploys separately on Vercel (see frontend/vercel.json).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aasrah-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    plan: starter
    envVars:
      - key: AASRAH_DATABASE_URL
        fromDatabase:
          name: aasrah-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://aasrah.vercel.app
      # Optional integrations, set in the Render dashboard when ready:
      - key: NVIDIA_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
    # Apply migrations on each deploy before the server starts.
    preDeployCommand: python -m scripts.init_db

databases:
  - name: aasrah-db
    plan: basic-256mb
    postgresMajorVersion: "16"
