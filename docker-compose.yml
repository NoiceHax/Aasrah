# Full-stack Aasrah: Postgres + FastAPI backend + Next.js frontend.
# For Neon, drop the `db` service and point AASRAH_DATABASE_URL at your Neon URL.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aasrah
      POSTGRES_PASSWORD: aasrah
      POSTGRES_DB: aasrah
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aasrah"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      AASRAH_DATABASE_URL: postgresql+psycopg://aasrah:aasrah@db:5432/aasrah
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    # Run migrations then start the server.
    command: >
      sh -c "python -m scripts.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
